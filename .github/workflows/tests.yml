name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python run_tests.py 2>&1 | tee test-output.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## Test failure on ${{ matrix.os }} / Python ${{ matrix.python-version }}"
              echo '```'
              tail -n 120 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 同时把日志尾部逐行作为 ::error:: annotation 输出，
            # 便于通过匿名 check-runs annotations API 读取真实报错（无需登录 GitHub）
            echo "::error::===== tail of test-output.log (last 40 lines) ====="
            tail -n 40 test-output.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit $rc
