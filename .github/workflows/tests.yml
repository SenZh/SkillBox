name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        shell: bash
        run: |
          set +e
          python run_tests.py 2>&1 | tee test-output.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## Test failure on ${{ matrix.os }} / Python ${{ matrix.python-version }}"
              echo '```'
              tail -n 120 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # 将日志尾部打包为单条支持换行 (%0A) 的 ::error:: annotation，
            # 彻底突破 GitHub 单 step 最多 10 条 annotation 的限制，完整透传报错与子进程输出
            python -c '
with open("test-output.log", "r", encoding="utf-8", errors="replace") as f:
    lines = f.readlines()[-80:]
content = "".join(lines)
escaped = content.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
print(f"::error title=Test Failure Traceback::{escaped}")
'
          fi
          exit $rc
