name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding ascii -Append
        shell: pwsh

      - name: Show toolchain versions
        run: |
          python --version
          python -m PyInstaller --version
          python -c "import webview, pystray, PIL, clr; print('deps ok')"

      - name: Build single-file exe
        shell: bash
        run: |
          set +e
          python tools/build_exe.py 2>&1 | tee build-exe.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            python tools/report_failure.py build-exe.log "Build Exe Failure Traceback" || true
          fi
          exit $rc

      - name: Build release artifacts (zip + installer script)
        run: python tools/build_release.py

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.exe
          generate_release_notes: true
