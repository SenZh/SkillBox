<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E7FF"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7CEFC"/>
      <stop offset="1" stop-color="#9DA8F5"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFE3FE"/>
      <stop offset="1" stop-color="#BAC3FB"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A1E7A" flood-opacity="0.38"/>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <path d="M16 132 C16 68 68 16 132 16 H380 C444 16 496 68 496 132 V198 C330 142 182 142 16 198 Z"
        fill="#FFFFFF" opacity="0.10"/>

  <!-- 放大的等距立方体（无文字，小尺寸专用） -->
  <g filter="url(#sh)">
    <polygon points="256,120 392,196 256,272 120,196" fill="url(#topFace)"/>
    <polygon points="120,196 256,272 256,432 120,356" fill="url(#leftFace)"/>
    <polygon points="392,196 256,272 256,432 392,356" fill="url(#rightFace)"/>
    <polyline points="120,196 256,120 392,196" fill="none" stroke="#FFFFFF" stroke-width="4.5" opacity="0.92"/>
    <line x1="256" y1="120" x2="256" y2="272" stroke="#FFFFFF" stroke-width="3.5" opacity="0.55"/>
    <!-- 左面知识节点 -->
    <g filter="url(#nodeGlow)">
      <line x1="170" y1="266" x2="206" y2="310" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
      <line x1="206" y1="310" x2="170" y2="354" stroke="#4F46E5" stroke-width="6" stroke-linecap="round" opacity="0.92"/>
      <circle cx="170" cy="266" r="15" fill="#4F46E5"/>
      <circle cx="170" cy="354" r="15" fill="#4F46E5"/>
      <circle cx="206" cy="310" r="18" fill="#312E81"/>
    </g>
  </g>
</svg>
